name: Build sync image

# Publishes the photo sync job to GitHub's container registry so the Pi can pull
# it rather than building it locally. Built for arm64 as well as amd64, since
# the Pi is ARM and the runners are not.

on:
  push:
    branches: [main, r2-migration]
    paths:
      - 'pipeline/**'
      - '.github/workflows/build-sync-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Lets the amd64 runner build the arm64 image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plot-timelapse-sync
          # Branch name for every build, plus :latest once it's on main
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./pipeline
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
