user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip Settings
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Don't gzip images as they're already compressed
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Client settings - allow larger uploads for photos
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # HTML, CSS, JS caching - short-lived
        location ~* \.(?:html|css|js)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            access_log off;
        }

        # Media files caching - longer lived
        location ~* \.(?:jpg|jpeg|gif|png|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Enable directory listing for the photos directory
        location /photos/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            add_header Cache-Control "public, max-age=3600";
            
            # Allow CORS for development
            add_header Access-Control-Allow-Origin "*";
            
            # Improve image delivery
            tcp_nodelay on;
            sendfile on;
            sendfile_max_chunk 1m;
        }
    }
}
